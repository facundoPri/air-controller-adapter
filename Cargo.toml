[package]
name = "ready-for-air"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "ready-for-air"

[dependencies]
gpui-kit = "=0.7.1"
# App bundles must not read icons from the build checkout, including debug builds.
rust-embed = { version = "8", features = ["debug-embed"] }
btleplug = { version = "0.11", features = ["serde"] }
hidapi = { version = "2.6", features = ["macos-shared-device"] }
cpal = "0.15"
hound = "3.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 1
